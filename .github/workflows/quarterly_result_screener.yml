name: Fetch and Commit Quarterly Result Screener Data
on:
  schedule:
    # Runs at 13:00 UTC (6:30 PM IST), Monday through Sunday
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
jobs:
  run-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the committed files back to the repository
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Quarterly Result Screener
        env:
          SCREENER_COOKIE: ${{ secrets.SCREENER_COOKIE }}
        run: |
          python scripts/quarterly_result_screener.py \
            --results-only \
            --unfiltered-out data/unfiltered_stock.json \
            --filtered-out data/result_stock.json
      - name: Commit and Push updated JSON data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unfiltered_stock.json data/result_stock.json
          git commit -m "Auto-update quarterly result screener data: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git pull --rebase origin main
          git push